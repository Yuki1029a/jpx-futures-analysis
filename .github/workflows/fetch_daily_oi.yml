name: Fetch Daily JPX Data

on:
  schedule:
    # 09:00 UTC = 18:00 JST — participant volume (手口)
    - cron: '0 9 * * 1-5'
    # 11:15 UTC = 20:15 JST — daily OI balance (建玉残高)
    - cron: '15 11 * * 1-5'
    # 12:15 UTC = 21:15 JST — 建玉残高の公表が遅れた日の追い掛け
    - cron: '15 12 * * 1-5'
    # 22:15 UTC = 翌朝07:15 JST — 取りこぼし回収（スクリプト側で直近3日分を試行）
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests openpyxl boto3 pdfplumber numpy pandas scipy pyarrow yfinance

      - name: Fetch and cache JPX data
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/fetch_daily_oi.py

      # J-Quants 日経225オプション日次（立会内／立会外の内訳など）。JQUANTS_API_KEY が未設定ならスキップ
      - name: J-Quants options daily
        continue-on-error: true
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/fetch_jquants_options.py --upload

      # 日次 γ 蓄積（リスク中立分布・べき効用の傾け・市場 γ）。引け気配（JST 16:02 取得）が揃う 18:00 以降の実行で当日分が入る。
      - name: Daily gamma record
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python scripts/gamma_daily.py
          python scripts/gamma_mle.py cache/derived --upload

      - name: Trigger Streamlit Cloud re-deploy
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last_data_update
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_data_update
          git diff --cached --quiet || git commit -m "data: update timestamp $(date -u +%Y%m%d-%H%M)"
          git push
